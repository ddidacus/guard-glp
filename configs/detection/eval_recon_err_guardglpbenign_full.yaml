# Reconstruction-error detection for the new layer-14 GLP, FULL-conversation view.
# GLP: local checkpoint (glp-llama1b-guardglpbenign-alltok-full-layer14-d3).
# Base LLM comes from `model: 1b` -> meta-llama/Llama-3.2-1B-Instruct (matches training).
#   sbatch scripts/detection/eval_classifier.sh configs/detection/eval_recon_err_guardglpbenign_full.yaml
layers: [14]                    # single-layer GLP (trained on layer 14 only)
model: "1b"
glp_model_id: /lambdafs/public_artifacts/results/GLP/glp-llama1b-guardglpbenign-alltok-full-layer14-d3
out_dir: "results/eval-recon_err-guardglpbenign-full"

# method
method: reconstruction_error
noise_level: 0.0       # how much noise to add before denoising (0=no noise, 1=full noise)
num_timesteps: 200
rec_num_timesteps: 50  # denoising steps for reconstruction
num_gpus: 4
