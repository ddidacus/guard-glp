# Baseline: off-the-shelf shipped GLP (generative-latent-prior/glp-llama1b-d12-multi,
# multi-layer) on guard_glp_data — reference point for the two new layer-14 GLPs.
# No glp_model_id -> falls back to the shipped default. Base LLM: Llama-3.2-1B (base),
# which is the model_name in this GLP's config (it was NOT trained on Instruct).
# (kept consistent with the other runs; note the shipped GLP was trained on base-model
# activations, so this is a slightly soft baseline).
#   python scripts/detection/evaluate_classifier.py run --config=<this> --gpu_id=0
layers: [14]                    # same layer as the new GLPs, for a head-to-head number
model: "1b"
# glp_model_id omitted -> generative-latent-prior/glp-llama1b-d12-multi
llm_model_id: meta-llama/Llama-3.2-1B   # base model this GLP trained on (its config's model_name), NOT Instruct
dataset: guard_glp_data
out_dir: "results/eval-recon_err-offtheshelf-guardglpbenign"

# method
method: reconstruction_error
noise_level: 0.0
num_timesteps: 200
rec_num_timesteps: 50
num_gpus: 1                    # single-GPU: one run scores the whole eval set (fast; ~1 min)
