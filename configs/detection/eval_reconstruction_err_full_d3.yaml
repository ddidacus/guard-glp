# GLP reconstruction-error eval for the local pre-trained checkpoint
# GLP/glp-llama1b-guardglpbenign-alltok-full-layer14-d3 (single-layer GLP, layer 14).
layers: [14]
model: "1b"
glp_model_id: "GLP/glp-llama1b-guardglpbenign-alltok-full-layer14-d3"
llm_model_id: "meta-llama/Llama-3.2-1B-Instruct"
out_dir: "results/eval-recon_err-full-layer14-d3"

# method
method: reconstruction_error
noise_level: 0.0      # how much noise to add before denoising (0=no noise, 1=full noise)
num_timesteps: 200
rec_num_timesteps: 50  # denoising steps for reconstruction
num_gpus: 2
