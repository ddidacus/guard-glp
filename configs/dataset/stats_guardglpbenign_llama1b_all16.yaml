# Stats pre-pass for streaming multi-layer GLP training (all 16 blocks, Llama-1B).
#   python scripts/dataset/compute_stats.py run \
#       --config=configs/dataset/stats_guardglpbenign_llama1b_all16.yaml
#
# Writes ${output_dir}/rep_statistics.pt with STACKED (16, 2048) mean/var indexed
# by absolute layer id (+ stats_manifest.json). A streaming training config points
# its `rep_statistic` here. Single process, one GPU, a few minutes: max_tokens caps
# the pass, and ~2M token-activations per layer is ample for per-dim mean/var.
#
# granularity must match the training stream (the all-token stream uses [all]);
# dataset/prompt-view must match too, or the stats describe a different distribution.
save_root: .
model_name: meta-llama/Llama-3.2-1B-Instruct
output_dir: ${save_root}/data/llama1b-guardglpbenign-useronly-stats-all16
backend: vllm_nnsight            # hf_baukit also works (slower; CPU-capable)
num_gpus: 1                      # single-process pass; sharding is unnecessary here
dataset:
  path: ddidacus/guard-glp-benign
  split: train
  format: chat
  conversation_field: conversation
  text_field: null
  prompt_view: user              # match the training stream's view
  dedup: true
  max_samples: null
extract:
  layer_prefix: model.layers
  layers: all                    # -> [0..15] from the model config
  retain: output
  granularity: [all]             # per-token stats: match the streaming run
  max_length: 2048
  batch_size: 16
  dtype: bfloat16
  max_tokens: 2000000            # stop after ~2M token-activations
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.4
